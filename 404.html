<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden · Sidar Avci</title>
<!-- VORSCHAU-PHASE: zum Livegang löschen -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#000;background:#fff;line-height:1.6}
header{border-bottom:4px solid #000;padding:1.25rem clamp(1.25rem,4vw,3rem)}
header a{font-weight:900;text-transform:uppercase;text-decoration:none;color:#000;display:inline-flex;gap:.6rem;align-items:center}
header i{width:.85rem;height:.85rem;border-radius:50%;background:#ff3000;display:inline-block}
main{padding:clamp(3rem,8vw,6rem) clamp(1.25rem,4vw,3rem);max-width:60rem}
h1{font-weight:900;text-transform:uppercase;letter-spacing:-.04em;line-height:.95;font-size:clamp(2.5rem,9vw,6rem);margin:0 0 2rem}
h1 span{color:#ff3000}p{max-width:60ch}a{color:#000}
.back{display:inline-block;margin-top:2rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.8125rem}
</style>
<style id="wash">
/* ============================================================
   LICHTSCHLEIER — ein ambienter Verlauf ueber die ganze Seite.
   --wash steuert die Staerke: 0 = aus, 1 = Empfehlung, 2 = doppelt.
   ============================================================ */
:root{
  --wash:1;
  --warm:255,214,198;     /* heller Akzentton, damit die Helligkeit bleibt */
  --cool:204,222,247;     /* heller kuehler Gegenpol */
}

/* Helle Flaechen: fester Schleier hinter dem Inhalt, scrollt nicht mit.
   Die Blueten sitzen rechts, unten und an den Raendern — der Textblock
   links oben, wo die rote Headline steht, bleibt hell. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(75% 85% at 118% 8%,   rgba(var(--cool),  calc(.55 * var(--wash))), transparent 62%),
    radial-gradient(60% 70% at 92% 96%,   rgba(var(--warm),  calc(.42 * var(--wash))), transparent 60%),
    radial-gradient(55% 60% at -14% 92%,  rgba(var(--cool),  calc(.40 * var(--wash))), transparent 58%),
    radial-gradient(40% 36% at -8% -8%,   rgba(var(--warm),  calc(.17 * var(--wash))), transparent 52%),
    var(--bg);
}

/* Graue Flaeche durchlaessig machen, damit der Schleier hindurchkommt */
.bg-muted{background-color:rgba(0,0,0,calc(.045 + .01 * var(--wash)))}

/* Kleine schwarze Elemente: nur ein leichter Schimmer, kein Radialverlauf */
.btn--primary,
.works-head .is-active,
.wsw__thumb,
.st-foot{
  background-image:linear-gradient(168deg,
    rgba(255,255,255,calc(.09 * var(--wash))) 0%,
    rgba(255,255,255,0) 58%);
}
.btn--primary{background-color:var(--fg)}

/* Die Bildschirm-Attrappe behaelt ihren harten Rahmen */
.st-screen{background-image:none}


/* ============================================================
   ASCHE — weisse Partikel, die langsam nach rechts treiben.
   Drei Tiefenebenen: nah gross/schnell/hell, fern klein/langsam/matt.
   ============================================================ */
.ash{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.ash + *{position:relative;z-index:1}
.contact > *:not(.ash),
.band > *:not(.ash),
.flowsec--dark > *:not(.ash),
.site-header > *:not(.ash){position:relative;z-index:1}
.ash i{position:absolute;display:block;border-radius:50%;background:#fff;
  will-change:transform;animation:drift linear infinite}
.ash i.f{width:2px;height:2px;opacity:.30}
.ash i.m{width:3px;height:3px;opacity:.52}
.ash i.n{width:4px;height:4px;opacity:.78;filter:blur(.5px);box-shadow:0 0 6px rgba(255,255,255,.35)}
@keyframes drift{
  from{transform:translate3d(-6vw,0,0)}
  to  {transform:translate3d(112vw,0,0)}
}
.ash b{position:absolute;display:block;animation:sway ease-in-out infinite alternate}
@keyframes sway{from{transform:translateY(-1.1rem)}to{transform:translateY(1.1rem)}}
@media (prefers-reduced-motion:reduce){
  .ash{display:none}
}

@media (prefers-reduced-transparency:reduce){
  body::before{display:none}
}
</style>
</head>
<body>
<header><a href="/"><i></i>Sidar Avci</a></header>
<main>
<h1>Seite nicht gefunden<span>.</span></h1>
<p>Diese Adresse gibt es nicht (mehr).</p>
<a class="back" href="/">← Zur Startseite</a>
</main>
<script>
/* Asche in die dunklen Flaechen streuen. Einmal erzeugt, danach reines CSS. */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ziele = document.querySelectorAll('.contact, .band, .flowsec--dark, .site-header');
  var ebenen = [
    {k:'f', d:1/9000,  dauer:[54,78], sway:[9,14]},   /* fern   */
    {k:'m', d:1/14000, dauer:[34,50], sway:[7,11]},   /* mitte  */
    {k:'n', d:1/26000, dauer:[20,30], sway:[5,8]}     /* nah    */
  ];
  var z = function(a,b){ return a + Math.random()*(b-a); };
  ziele.forEach(function(ziel){
    var flaeche = ziel.offsetWidth * ziel.offsetHeight;
    var box = document.createElement('div');
    box.className = 'ash'; box.setAttribute('aria-hidden','true');
    ebenen.forEach(function(e){
      var anzahl = Math.max(3, Math.min(70, Math.round(flaeche * e.d)));
      for (var i=0; i<anzahl; i++){
        var sway = document.createElement('b');
        sway.style.top = z(2,96).toFixed(1)+'%';
        sway.style.left = '0';
        sway.style.width = '100%';
        sway.style.animationDuration = z(e.sway[0], e.sway[1]).toFixed(1)+'s';
        sway.style.animationDelay = (-z(0,12)).toFixed(1)+'s';
        var p = document.createElement('i');
        p.className = e.k;
        p.style.animationDuration = z(e.dauer[0], e.dauer[1]).toFixed(1)+'s';
        p.style.animationDelay = (-z(0, e.dauer[1])).toFixed(1)+'s';
        sway.appendChild(p);
        box.appendChild(sway);
      }
    });
    ziel.insertBefore(box, ziel.firstChild);
  });
})();
</script>
</body>
</html>
