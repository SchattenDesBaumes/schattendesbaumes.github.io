<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidar Avci — Seite im Umbau</title>
<meta name="description" content="Die Website von Sidar Avci wird gerade umgebaut. Kontakt per Mail: sidar.arbeit@gmail.com">
<!-- VORSCHAU-PHASE: zum Livegang löschen -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="preload" href="/assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='22' cy='10' r='6' fill='%23ff3000'/%3E%3C/svg%3E">
<!--
  UMBAU-SEITE
  Die vollständige Website liegt unter /vorschau/.
  Zum Livegang: /vorschau/index.html hierher (als /index.html) kopieren
  und den Ordner /vorschau/ löschen.
-->
<style>
@font-face{font-family:"Inter";src:url(/assets/fonts/inter.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{
  --bg:#fff;--fg:#000;--muted:#f2f2f2;--accent:#ff3000;--accent-ink:#d42a00;--gray:#5c5c5c;
  --b:4px;--b2:2px;--pad:clamp(1.25rem,4vw,3rem);
  --ease:cubic-bezier(.2,0,0,1);
  --font:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1.0625rem;line-height:1.6;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100svh;overflow-x:hidden}
a{color:inherit}
h1,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Kopf */
.hdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0 var(--pad);height:4.25rem;border-bottom:var(--b) solid var(--fg)}
.brand{font-weight:900;text-transform:uppercase;letter-spacing:-.02em;font-size:1.125rem;text-decoration:none;display:flex;align-items:center;gap:.6rem}
.brand i{width:.85rem;height:.85rem;background:var(--accent);border-radius:50%;display:inline-block}
.status{font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:.6rem}
.status i{width:.6rem;height:.6rem;border-radius:50%;background:var(--accent);animation:blink 1.4s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.15}}

/* Hauptfläche */
main{flex:1;display:grid;grid-template-columns:1fr}
.text{padding:clamp(3rem,8vw,6rem) var(--pad);display:flex;flex-direction:column;justify-content:center;gap:2rem}
.eyebrow{color:var(--accent);font-weight:800;font-size:clamp(1.25rem,1.9vw,1.75rem);line-height:1.2;letter-spacing:-.01em}
.eyebrow span{color:var(--fg)}
h1{font-weight:900;text-transform:uppercase;letter-spacing:-.045em;line-height:.92;font-size:clamp(3.25rem,14vw,9rem)}
h1 .red{color:var(--accent)}
.lead{font-size:clamp(1.125rem,1.6vw,1.375rem);line-height:1.45;font-weight:500;max-width:34ch}
.btn{display:inline-flex;align-items:center;gap:.75rem;min-height:3.5rem;padding:0 1.5rem;width:fit-content;
  border:var(--b2) solid var(--accent);background:var(--accent);color:var(--fg);font-weight:700;font-size:.875rem;letter-spacing:.1em;
  text-transform:uppercase;text-decoration:none;transition:background-color .15s linear,color .15s linear,border-color .15s linear}
.btn svg{width:1.125rem;height:1.125rem;transition:transform .2s var(--ease)}
.btn:hover{background:var(--fg);border-color:var(--fg);color:#fff}
.btn:hover svg{transform:translateX(4px)}
.small{font-size:.9375rem;color:var(--gray)}
.small a{font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.2em;color:var(--fg)}
.small a:hover{color:var(--accent-ink)}

/* Fortschritt */
.progress{border-top:var(--b2) solid var(--fg);padding-top:1rem;max-width:30rem}
.progress__label{display:flex;justify-content:space-between;font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.progress__bar{margin-top:.75rem;height:.75rem;border:var(--b2) solid var(--fg);position:relative;overflow:hidden}
.progress__bar::before{content:"";position:absolute;inset:0;width:72%;background:repeating-linear-gradient(45deg,var(--fg) 0 3px,transparent 3px 9px)}
.progress__bar::after{content:"";position:absolute;top:0;bottom:0;left:72%;width:12%;background:var(--accent);animation:work 2.4s var(--ease) infinite alternate}
@keyframes work{from{transform:translateX(-100%)}to{transform:none}}

/* Bildfläche */
.art{position:relative;border-top:var(--b) solid var(--fg);min-height:22rem;overflow:hidden;
  background-color:var(--muted);
  background-image:linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px);
  background-size:24px 24px}
.art>*{position:absolute}
.s-circle{width:min(46%,22rem);aspect-ratio:1;border-radius:50%;background:var(--accent);top:12%;right:10%;box-shadow:0 0 0 14px rgba(255,48,0,.12);
  animation:pop .5s var(--ease) .1s both}
.s-square{width:min(34%,16rem);aspect-ratio:1;background:var(--fg);left:12%;bottom:12%;animation:slide .45s var(--ease) .25s both}
.s-stripe{width:min(30%,14rem);aspect-ratio:1;left:38%;top:16%;background:repeating-linear-gradient(45deg,var(--fg) 0 3px,transparent 3px 11px);
  animation:slide .45s var(--ease) .4s both}
.s-ring{width:min(18%,8rem);aspect-ratio:1;border-radius:50%;border:5px solid var(--fg);right:22%;bottom:10%;animation:pop .45s var(--ease) .55s both}
.s-plus{width:3rem;height:3rem;left:8%;top:12%;animation:spin 6s linear infinite}
.s-plus::before,.s-plus::after{content:"";position:absolute;left:50%;top:50%;background:var(--fg);transform:translate(-50%,-50%)}
.s-plus::before{width:100%;height:4px}.s-plus::after{width:4px;height:100%}
.s-tape{left:-5%;right:-5%;top:58%;height:3rem;transform:rotate(-8deg);
  background:repeating-linear-gradient(-45deg,var(--fg) 0 22px,var(--accent) 22px 44px);
  border-block:var(--b2) solid var(--fg);animation:tape .6s var(--ease) .7s both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes slide{from{transform:translateY(30%);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tape{from{transform:rotate(-8deg) scaleX(0)}to{transform:rotate(-8deg) scaleX(1)}}

@media (min-width:1024px){
  main{grid-template-columns:7fr 5fr}
  .art{border-top:0;border-left:var(--b) solid var(--fg);min-height:0}
}

/* Fuß */
.ftr{flex:none;border-top:var(--b) solid var(--fg);padding:1.25rem var(--pad);display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;justify-content:space-between;font-size:.8125rem}
.ftr nav{display:flex;gap:1.5rem}
.ftr a{text-decoration:none;font-weight:600;border-bottom:var(--b2) solid transparent}
.ftr a:hover{border-color:var(--accent);color:var(--accent-ink)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<header class="hdr">
  <a class="brand" href="/"><i aria-hidden="true"></i>Sidar Avci</a>
  <p class="status"><i aria-hidden="true"></i>Im Umbau</p>
</header>

<main>
  <div class="text">
    <p class="eyebrow">Hi, ich bin Sidar<span>.</span></p>
    <h1>Seite im Umbau<span class="red">.</span></h1>
    <p class="lead">Hier entsteht gerade meine neue Website. Bis sie fertig ist, erreichen Sie mich direkt per Mail.</p>
    <a class="btn" href="mailto:sidar.arbeit@gmail.com">
      Mail schreiben
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </a>
    <p class="small">Oder direkt an <a href="mailto:sidar.arbeit@gmail.com">sidar.arbeit@gmail.com</a></p>
    <div class="progress" aria-hidden="true">
      <div class="progress__label"><span>Fortschritt</span><span>Bald fertig</span></div>
      <div class="progress__bar"></div>
    </div>
  </div>
  <div class="art" aria-hidden="true">
    <span class="s-stripe"></span>
    <span class="s-circle"></span>
    <span class="s-square"></span>
    <span class="s-ring"></span>
    <span class="s-plus"></span>
    <span class="s-tape"></span>
  </div>
</main>

<footer class="ftr">
  <span>© 2026 Sidar Avci</span>
  <nav aria-label="Rechtliches">
    <a href="/impressum/">Impressum</a>
    <a href="/datenschutz/">Datenschutz</a>
  </nav>
</footer>

</body>
</html>
